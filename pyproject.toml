[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eptal-analyzer"
version = "1.0.31"
description = "Eptal-Analyzer - современный анализатор сети для Windows. Основан на L0p4Map by HaxL0p4 (GPL-3.0)."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "HaxL0p4", email = "haxl0p4@proton.me" }
]
requires-python = ">=3.11"
keywords = ["network", "scanner", "nmap", "security", "visualization", "windows"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "scapy",
    "psutil",
    "PyQt6",
    "PyQt6-WebEngine",
]

[project.urls]
Homepage = "https://github.com/HaxL0p4/L0p4Map"
"Bug Tracker" = "https://github.com/HaxL0p4/L0p4Map/issues"

[project.scripts]
eptal-analyzer = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "ui*"]

[tool.setuptools.package-data]
"core" = ["oui.csv"]
"ui" = ["assets/*"]
"ui.assets" = ["*"]
