<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background-color: #0d0d0d; overflow: hidden; }
  #graph { width: 100vw; height: 100vh; }

  .vis-tooltip {
    background-color: #111111 !important;
    border: 1px solid #00ff9944 !important;
    border-radius: 0 !important;
    color: #e0e0e0 !important;
    font-family: 'JetBrains Mono', monospace !important;
    font-size: 11px !important;
    padding: 10px 12px !important;
    box-shadow: 0 0 12px #00ff9922 !important;
    max-width: 260px !important;
  }

  #legend {
    position: absolute;
    bottom: 16px;
    left: 16px;
    background: #111111;
    border: 1px solid #1a1a1a;
    padding: 10px 14px;
    font-family: monospace;
    font-size: 11px;
    color: #d0d0d0;
    z-index: 100;
    pointer-events: none;
  }
  #legend .item {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 4px;
  }
  #legend .dot {
    width: 12px;
    height: 12px;
    border-radius: 3px;
    border: 2px solid;
    flex-shrink: 0;
  }
  #legend .edge-sample {
    width: 22px;
    height: 2px;
    flex-shrink: 0;
  }
  #legend .sep {
    border-top: 1px solid #1a1a1a;
    margin: 6px 0;
  }

  #counter {
    position: absolute;
    top: 10px;
    right: 16px;
    font-family: monospace;
    font-size: 11px;
    color: #b0b0b0;
    pointer-events: none;
  }

  #topo-panel {
    position: absolute;
    top: 10px;
    left: 16px;
    background: #0e0e0e;
    border: 1px solid #1a1a1a;
    padding: 8px 12px;
    font-family: monospace;
    font-size: 10px;
    color: #b8b8b8;
    z-index: 100;
    pointer-events: none;
    min-width: 190px;
  }
  #topo-panel .tp-row {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 3px;
  }
  #topo-panel .tp-label { color: #cfcfcf; }
  #topo-panel .tp-value { color: #00ff9977; text-align: right; font-size: 10px; }

  #layout-btn {
    position: absolute;
    bottom: 16px;
    right: 16px;
    background: #111111;
    border: 1px solid #2a2a2a;
    border-radius: 10px;
    color: #bfbfbf;
    font-family: monospace;
    font-size: 12px;
    padding: 9px 16px;
    cursor: pointer;
    z-index: 100;
    letter-spacing: 0.5px;
    user-select: none;
  }
  #layout-btn:hover { border-color: #00ff9966; color: #00ff99; }
  #layout-btn.active { border-color: #00ff9944; color: #00ff99; }
</style>
<link rel="stylesheet" href="vis-network.min.css">
<script src="vis-network.min.js"></script>
</head>
<body>
<div id="graph"></div>

<div id="topo-panel">
  <div class="tp-row"><span class="tp-label" id="lbl-subnet">ПОДСЕТЬ</span><span class="tp-value" id="tp-subnet">—</span></div>
  <div class="tp-row"><span class="tp-label" id="lbl-gateway">ШЛЮЗ</span><span class="tp-value" id="tp-gateway">—</span></div>
  <div class="tp-row"><span class="tp-label" id="lbl-devices">УСТРОЙСТВА</span><span class="tp-value" id="tp-devices">0</span></div>
  <div class="tp-row"><span class="tp-label" id="lbl-intermediates">ПРОМЕЖУТОЧНЫЕ</span><span class="tp-value" id="tp-intermediates">0</span></div>
</div>

<div id="legend">
  <div class="item"><div class="dot" style="border-color:#00ff99;background:#003322"></div><span id="leg_gateway">Шлюз</span></div>
  <div class="item"><div class="dot" style="border-color:#00ccff;background:#001a33"></div><span id="leg_router">Маршрутизатор</span></div>
  <div class="item"><div class="dot" style="border-color:#ff9900;background:#332200"></div><span id="leg_ap">Точка доступа</span></div>
  <div class="item"><div class="dot" style="border-color:#00aaff;background:#001a2e"></div><span id="leg_switch">Коммутатор</span></div>
  <div class="item"><div class="dot" style="border-color:#5555ff;background:#1a1a2e"></div><span id="leg_pc">ПК / Рабочая станция</span></div>
  <div class="item"><div class="dot" style="border-color:#aaaaaa;background:#1a1a1a"></div><span id="leg_apple">Устройство Apple</span></div>
  <div class="item"><div class="dot" style="border-color:#ff5599;background:#2e1a2e"></div><span id="leg_mobile">Мобильное устройство</span></div>
  <div class="item"><div class="dot" style="border-color:#cc0000;background:#2e0000"></div><span id="leg_rpi">Raspberry Pi</span></div>
  <div class="item"><div class="dot" style="border-color:#9900ff;background:#1a0033"></div><span id="leg_vm">Виртуальная машина</span></div>
  <div class="item"><div class="dot" style="border-color:#444444;background:#1a1a1a"></div><span id="leg_unknown">Неизвестно</span></div>
  <div class="item"><div class="dot" style="border-color:#ffcc00;background:#332b00"></div><span id="leg_embedded">Встроенный сервис (риск стандартных учётных данных)</span></div>
  <div class="sep"></div>
  <div class="item">
    <div class="edge-sample" style="background:repeating-linear-gradient(90deg,#333 0,#333 4px,transparent 4px,transparent 8px)"></div>
    <span id="leg_uplink">Аплинк</span>
  </div>
  <div class="item">
    <div class="edge-sample" style="background:#00ccff44;height:2px"></div>
    <span id="leg_backbone">Магистраль</span>
  </div>
  <div class="item">
    <div class="edge-sample" style="background:#222;height:1px"></div>
    <span id="leg_client">Клиентская связь</span>
  </div>
</div>

<div id="counter">// 0 устройств</div>

<div id="layout-btn" class="active" onclick="toggleLayout()">ИЕРАРХИЯ</div>

<script>
let network = null;
let currentTopology = null;
let hierarchicalMode = true;
let subnetsForDraw = [];
let graphLang = "ru";
let lastDeviceCount = 0;

const GRAPH_I18N = {
  ru: {
    subnet:"ПОДСЕТЬ", gateway:"ШЛЮЗ", devices:"УСТРОЙСТВА", intermediates:"ПРОМЕЖУТОЧНЫЕ",
    leg_gateway:"Шлюз", leg_router:"Маршрутизатор", leg_ap:"Точка доступа", leg_switch:"Коммутатор",
    leg_pc:"ПК / Рабочая станция", leg_apple:"Устройство Apple", leg_mobile:"Мобильное устройство",
    leg_rpi:"Raspberry Pi", leg_vm:"Виртуальная машина", leg_unknown:"Неизвестно",
    leg_embedded:"Встроенный сервис (риск стандартных учётных данных)",
    leg_uplink:"Аплинк", leg_backbone:"Магистраль", leg_client:"Клиентская связь",
    hierarchy:"ИЕРАРХИЯ", force:"СИЛОВАЯ СХЕМА", counter:"// {n} устройств", promptName:"Своё имя для {ip}:"
  },
  en: {
    subnet:"SUBNET", gateway:"GATEWAY", devices:"DEVICES", intermediates:"INTERMEDIATES",
    leg_gateway:"Gateway", leg_router:"Router", leg_ap:"Access point", leg_switch:"Switch",
    leg_pc:"PC / Workstation", leg_apple:"Apple device", leg_mobile:"Mobile device",
    leg_rpi:"Raspberry Pi", leg_vm:"Virtual machine", leg_unknown:"Unknown",
    leg_embedded:"Embedded service (default credentials risk)",
    leg_uplink:"Uplink", leg_backbone:"Backbone", leg_client:"Client link",
    hierarchy:"HIERARCHY", force:"FORCE LAYOUT", counter:"// {n} devices", promptName:"Custom name for {ip}:"
  }
};

function setGraphLang(lang) {
  graphLang = (lang === "en") ? "en" : "ru";
  const t = GRAPH_I18N[graphLang];
  const set = (id, val) => { const el = document.getElementById(id); if (el) el.textContent = val; };
  set("lbl-subnet", t.subnet); set("lbl-gateway", t.gateway); set("lbl-devices", t.devices); set("lbl-intermediates", t.intermediates);
  ["leg_gateway","leg_router","leg_ap","leg_switch","leg_pc","leg_apple","leg_mobile","leg_rpi","leg_vm","leg_unknown","leg_embedded","leg_uplink","leg_backbone","leg_client"].forEach(k => set(k, t[k]));
  set("layout-btn", hierarchicalMode ? t.hierarchy : t.force);
  set("counter", t.counter.replace("{n}", lastDeviceCount));
}

function toggleLayout() {
  hierarchicalMode = !hierarchicalMode;
  const btn = document.getElementById("layout-btn");
  const t = GRAPH_I18N[graphLang];
  btn.textContent = hierarchicalMode ? t.hierarchy : t.force;
  btn.className = hierarchicalMode ? "active" : "";
  if (currentTopology) _renderTopology(currentTopology);
}

function getRoleStyle(role) {
  const styles = {
    gateway:   { bg: "#003322", border: "#00ff99", size: 30, label: "GATEWAY" },
    router:    { bg: "#001a33", border: "#00ccff", size: 24, label: "ROUTER" },
    ap:        { bg: "#332200", border: "#ff9900", size: 22, label: "ACCESS POINT" },
    switch:    { bg: "#001a2e", border: "#00aaff", size: 22, label: "SWITCH" },
    pc:        { bg: "#1a1a2e", border: "#5555ff", size: 16, label: "PC" },
    apple:     { bg: "#1a1a1a", border: "#aaaaaa", size: 16, label: "APPLE" },
    mobile:    { bg: "#2e1a2e", border: "#ff5599", size: 14, label: "MOBILE" },
    raspberry: { bg: "#2e0000", border: "#cc0000", size: 16, label: "RASPBERRY PI" },
    vm:        { bg: "#1a0033", border: "#9900ff", size: 14, label: "VIRTUAL MACHINE" },
    unknown:   { bg: "#1a1a1a", border: "#444444", size: 14, label: "UNKNOWN" },
  };
  return styles[role] || styles.unknown;
}

function getRoleImage(role, style, flagged) {
  // SVG-иконка устройства для узла карты сети.
  const stroke = flagged ? "#ffcc00" : style.border;
  const bg = style.bg;
  const soft = stroke + "33";
  const icons = {
    gateway: '<circle cx="32" cy="32" r="11" fill="' + soft + '" stroke="' + stroke + '" stroke-width="2.4"/><path d="M32 17v6M32 41v6M17 32h6M41 32h6M21.5 21.5l4.2 4.2M38.3 38.3l4.2 4.2M42.5 21.5l-4.2 4.2M25.7 38.3l-4.2 4.2" stroke="' + stroke + '" stroke-width="2.4" stroke-linecap="round"/><circle cx="32" cy="32" r="3" fill="' + stroke + '"/>',
    router: '<rect x="13" y="26" width="38" height="14" rx="7" fill="' + soft + '" stroke="' + stroke + '" stroke-width="2.4"/><path d="M20 26l-4-7M32 26v-9M44 26l4-7" stroke="' + stroke + '" stroke-width="2.4" stroke-linecap="round"/><circle cx="22" cy="33" r="1.8" fill="' + stroke + '"/><circle cx="28" cy="33" r="1.8" fill="' + stroke + '"/><path d="M35 33h8" stroke="' + stroke + '" stroke-width="2.4" stroke-linecap="round"/>',
    ap: '<path d="M32 39v6" stroke="' + stroke + '" stroke-width="2.4" stroke-linecap="round"/><circle cx="32" cy="35" r="2.5" fill="' + stroke + '"/><path d="M25.5 29.5a9 9 0 0 1 13 0M20.5 24.5a16 16 0 0 1 23 0M15.5 19.5a23 23 0 0 1 33 0" fill="none" stroke="' + stroke + '" stroke-width="2.4" stroke-linecap="round"/>',
    switch: '<rect x="12" y="23" width="40" height="18" rx="6" fill="' + soft + '" stroke="' + stroke + '" stroke-width="2.4"/><path d="M20 30h5l-2-2m2 2-2 2M31 34h5l-2-2m2 2-2 2M42 30h2" stroke="' + stroke + '" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>',
    pc: '<rect x="14" y="15" width="36" height="24" rx="5" fill="' + soft + '" stroke="' + stroke + '" stroke-width="2.4"/><path d="M24 47h16M28 39l-1 8M36 39l1 8" stroke="' + stroke + '" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 33h24" stroke="' + stroke + '" stroke-width="1.5" opacity="0.35"/>',
    apple: '<path d="M36.5 17c-1.8 0-3.6.9-4.7 2.5-1.1-1.6-2.9-2.5-4.7-2.5-3.7 0-6.8 3.1-6.8 7.4 0 5.7 4.6 12.3 8.4 12.3 1 0 2-.4 3.1-.4s2.1.4 3.1.4c3.8 0 8.4-6.6 8.4-12.3 0-4.3-3.1-7.4-6.8-7.4z" fill="' + soft + '" stroke="' + stroke + '" stroke-width="2.4" stroke-linejoin="round"/><path d="M34.5 12.5c.8 1.8.6 3.9-.6 5.5-1.8-.6-3.1-2.2-3.3-4.1 1.4-1.2 2.8-1.6 3.9-1.4z" fill="' + stroke + '"/>',
    mobile: '<rect x="22" y="13" width="20" height="38" rx="6" fill="' + soft + '" stroke="' + stroke + '" stroke-width="2.4"/><path d="M29 18h6" stroke="' + stroke + '" stroke-width="2.4" stroke-linecap="round"/><circle cx="32" cy="45" r="1.7" fill="' + stroke + '"/>',
    raspberry: '<rect x="18" y="18" width="28" height="28" rx="7" fill="' + soft + '" stroke="' + stroke + '" stroke-width="2.4"/><circle cx="26" cy="26" r="2.2" fill="' + stroke + '"/><circle cx="38" cy="26" r="2.2" fill="' + stroke + '"/><circle cx="26" cy="38" r="2.2" fill="' + stroke + '"/><circle cx="38" cy="38" r="2.2" fill="' + stroke + '"/><path d="M32 29v6m-3-3h6" stroke="' + stroke + '" stroke-width="2.2" stroke-linecap="round"/>',
    vm: '<rect x="13" y="16" width="38" height="26" rx="6" fill="' + soft + '" stroke="' + stroke + '" stroke-width="2.4"/><path d="M22 48h20M26 42l-1 6M38 42l1 6" stroke="' + stroke + '" stroke-width="2.4" stroke-linecap="round"/><rect x="19" y="22" width="10" height="8" rx="2" fill="none" stroke="' + stroke + '" stroke-width="2"/><rect x="35" y="22" width="10" height="8" rx="2" fill="none" stroke="' + stroke + '" stroke-width="2"/>',
    unknown: '<circle cx="32" cy="32" r="14" fill="' + soft + '" stroke="' + stroke + '" stroke-width="2.4"/><path d="M27.5 27.5a5 5 0 1 1 4.5 7.2v2.1" fill="none" stroke="' + stroke + '" stroke-width="2.4" stroke-linecap="round"/><circle cx="32" cy="41.5" r="1.6" fill="' + stroke + '"/>',
  };
  const icon = icons[role] || icons.unknown;
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">'
    + '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/><stop offset="100%" stop-color="#ffffff" stop-opacity="0"/></linearGradient></defs>'
    + '<rect x="4" y="4" width="56" height="56" rx="16" fill="' + bg + '" stroke="' + stroke + '" stroke-width="2.6"/>'
    + '<rect x="4" y="4" width="56" height="56" rx="16" fill="url(#g)"/>'
    + icon + '</svg>';
  return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
}

function getRole(device) {
  if (device.role && device.role !== "unknown") return device.role;
  const ip = device.ip || "";
  const vendor = (device.vendor || "").toLowerCase();
  const hostname = (device.hostname || "").toLowerCase();
  if (ip.endsWith(".1") || ip.endsWith(".254") || hostname === "router" || hostname === "gateway") return "gateway";
  if (hostname.includes("switch")) return "switch";
  if (hostname.includes("router")) return "router";
  if (hostname.includes("ap") || hostname.includes("wifi")) return "ap";
  if (vendor.includes("cisco") || vendor.includes("mikrotik") || vendor.includes("ubiquiti") || vendor.includes("juniper") || vendor.includes("fortinet")) return "router";
  if (vendor.includes("tp-link") || vendor.includes("netgear") || vendor.includes("dlink") || vendor.includes("linksys") || vendor.includes("tenda") || vendor.includes("zyxel") || vendor.includes("aruba")) return "ap";
  if (vendor.includes("apple") || hostname.includes("iphone") || hostname.includes("ipad") || hostname.includes("macbook")) return "apple";
  if (vendor.includes("samsung") || vendor.includes("xiaomi") || vendor.includes("oneplus") || vendor.includes("huawei") || vendor.includes("honor") || vendor.includes("google") || hostname.includes("android") || hostname.includes("tablet") || hostname.includes("galaxy") || hostname.includes("pixel") || hostname.includes("phone")) return "mobile";
  if (vendor.includes("raspberry")) return "raspberry";
  if (vendor.includes("vmware") || vendor.includes("virtualbox") || vendor.includes("proxmox")) return "vm";
  if (vendor.includes("intel") || vendor.includes("dell") || vendor.includes("hp") || vendor.includes("lenovo") || vendor.includes("asus") || hostname.includes("desktop") || hostname.includes("pc") || hostname.includes("linux") || hostname.includes("windows")) return "pc";
  return "unknown";
}

function makeTooltip(role, device, style) {
  const esc = (v) => String(v ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
  const el = document.createElement("div");
  const ports = (device.open_ports && device.open_ports.length) ? device.open_ports.map(esc).join(", ") : "—";
  const ttl = device.ttl != null ? esc(device.ttl) : "—";
  const osHint = device.os_hint && device.os_hint !== "unknown" ? esc(device.os_hint) : "—";
  const snmp = device.snmp_desc ? String(device.snmp_desc) : "";
  const snmpRow = snmp
    ? `<div style="color:#888;margin-bottom:2px;margin-top:2px">SNMP</div>
       <div style="color:#aaaaaa;margin-bottom:0;font-size:10px;word-break:break-all">${esc(snmp.substring(0, 80))}${snmp.length > 80 ? "…" : ""}</div>`
    : "";
  const embeddedRow = device.embedded_device
    ? `<div style="color:#ffcc00;margin-bottom:2px;margin-top:2px">ВСТРОЕННЫЙ СЕРВИС</div>
       <div style="color:#ffcc00;margin-bottom:0;font-size:10px">${esc(device.embedded_device)} — возможны стандартные учётные данные, проверьте вручную</div>`
    : "";
  el.innerHTML = `
    <div style="color:${style.border};font-weight:bold;margin-bottom:6px;letter-spacing:1px">${esc(style.label)}</div>
    <div style="color:#888;margin-bottom:2px">IP</div>
    <div style="color:#e0e0e0;margin-bottom:6px">${esc(device.ip)}</div>
    <div style="color:#888;margin-bottom:2px">MAC</div>
    <div style="color:#e0e0e0;margin-bottom:6px">${esc(device.mac)}</div>
    <div style="color:#888;margin-bottom:2px">ПРОИЗВОДИТЕЛЬ</div>
    <div style="color:#e0e0e0;margin-bottom:6px">${esc(device.vendor || "Неизвестно")}</div>
    <div style="color:#888;margin-bottom:2px">ИМЯ ХОСТА</div>
    <div style="color:#e0e0e0;margin-bottom:6px">${esc(device.hostname)}</div>
    <div style="display:flex;gap:16px;margin-bottom:6px">
      <div><div style="color:#888;margin-bottom:2px">TTL</div><div style="color:#e0e0e0">${ttl}</div></div>
      <div><div style="color:#888;margin-bottom:2px">ПОДСКАЗКА ОС</div><div style="color:#e0e0e0">${osHint}</div></div>
    </div>
    <div style="color:#888;margin-bottom:2px">ОТКРЫТЫЕ ПОРТЫ</div>
    <div style="color:#e0e0e0;margin-bottom:${(snmpRow || embeddedRow) ? "6px" : "0"}">${ports}</div>
    ${embeddedRow}
    ${snmpRow}
  `;
  return el;
}

function makeInternetTooltip() {
  const el = document.createElement("div");
  el.innerHTML = `<div  style="color:#555;font-weight:bold;letter-spacing:1px">ИНТЕРНЕТ</div><div style="color:#333;font-size:10px;margin-top:4px">Внешнее сетевое подключение</div>`;
  return el;
}

function getEdgeStyle(type) {
  if (type === "uplink") return {
    dashes: [6, 4],
    color: { color: "#222222", highlight: "#444444", hover: "#333333" },
    arrows: { to: { enabled: true, scaleFactor: 0.4, type: "arrow" } },
    width: 1,
    smooth: { type: "curvedCW", roundness: 0.2 },
  };
  if (type === "backbone") return {
    dashes: false,
    color: { color: "#00ccff2a", highlight: "#00ccff88", hover: "#00ccff44" },
    arrows: { to: { enabled: true, scaleFactor: 0.5, type: "arrow" } },
    width: 2,
    smooth: { type: "curvedCW", roundness: 0.15 },
  };
  return {
    dashes: false,
    color: { color: "#1a1a1a", highlight: "#00ff9944", hover: "#252525" },
    arrows: { to: { enabled: true, scaleFactor: 0.35, type: "arrow" } },
    width: 1,
    smooth: { type: "curvedCW", roundness: 0.12 },
  };
}

function buildOptions() {
  if (hierarchicalMode) {
    return {
      nodes: {
        shape: "dot",
        font: { color: "#666666", face: "monospace", size: 10 },
        borderWidth: 2,
        shadow: { enabled: true, color: "rgba(0,0,0,0.6)", size: 10 },
      },
      edges: { shadow: false },
      layout: {
        hierarchical: {
          enabled: true,
          direction: "UD",
          sortMethod: "directed",
          levelSeparation: 140,
          nodeSpacing: 110,
          treeSpacing: 160,
          blockShifting: true,
          edgeMinimization: true,
          parentCentralization: true,
        },
      },
      physics: {
        enabled: true,
        solver: "hierarchicalRepulsion",
        hierarchicalRepulsion: {
          centralGravity: 0.0,
          springLength: 110,
          springConstant: 0.005,
          nodeDistance: 130,
          damping: 0.12,
          avoidOverlap: 1,
        },
        stabilization: { iterations: 400, updateInterval: 20 },
      },
      interaction: {
        hover: true,
        tooltipDelay: 80,
        zoomView: true,
        dragView: true,
        dragNodes: true,
      },
    };
  }
  return {
    nodes: {
      shape: "dot",
      font: { color: "#666666", face: "monospace", size: 10 },
      borderWidth: 2,
      shadow: { enabled: true, color: "rgba(0,0,0,0.5)", size: 8 },
    },
    edges: { shadow: false },
    layout: { hierarchical: { enabled: false } },
    physics: {
      enabled: true,
      solver: "forceAtlas2Based",
      forceAtlas2Based: {
        gravitationalConstant: -70,
        centralGravity: 0.006,
        springLength: 150,
        springConstant: 0.05,
        damping: 0.9,
        avoidOverlap: 0.5,
      },
      stabilization: { iterations: 300, updateInterval: 25 },
    },
    interaction: {
      hover: true,
      tooltipDelay: 80,
      zoomView: true,
      dragView: true,
      dragNodes: true,
    },
  };
}

function updateTopoPanel(subnet, gateway, deviceCount, intermediateCount) {
  document.getElementById("tp-subnet").textContent = subnet || "—";
  document.getElementById("tp-gateway").textContent = gateway || "—";
  document.getElementById("tp-devices").textContent = deviceCount;
  document.getElementById("tp-intermediates").textContent = intermediateCount;
}

function _drawSubnetBoxes(ctx) {
  if (!hierarchicalMode || subnetsForDraw.length === 0) return;
  subnetsForDraw.forEach(function(snet) {
    const ips = snet.devices || [];
    if (ips.length < 1) return;
    const positions = ips.map(function(ip) {
      try { return network.getPosition(ip); } catch(e) { return null; }
    }).filter(function(p) { return p !== null; });
    if (positions.length < 1) return;

    const xs = positions.map(function(p) { return p.x; });
    const ys = positions.map(function(p) { return p.y; });
    const pad = 55;
    const x1 = Math.min.apply(null, xs) - pad;
    const y1 = Math.min.apply(null, ys) - pad;
    const x2 = Math.max.apply(null, xs) + pad;
    const y2 = Math.max.apply(null, ys) + pad;

    ctx.save();
    ctx.setLineDash([5, 5]);
    ctx.strokeStyle = "#00ff9918";
    ctx.fillStyle = "#00ff9904";
    ctx.lineWidth = 1;
    const r = 10;
    ctx.beginPath();
    ctx.moveTo(x1 + r, y1);
    ctx.lineTo(x2 - r, y1);
    ctx.arcTo(x2, y1, x2, y1 + r, r);
    ctx.lineTo(x2, y2 - r);
    ctx.arcTo(x2, y2, x2 - r, y2, r);
    ctx.lineTo(x1 + r, y2);
    ctx.arcTo(x1, y2, x1, y2 - r, r);
    ctx.lineTo(x1, y1 + r);
    ctx.arcTo(x1, y1, x1 + r, y1, r);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.setLineDash([]);
    ctx.font = "9px monospace";
    ctx.fillStyle = "#00ff9940";
    ctx.fillText(snet.network || "", x1 + 6, y1 + 13);
    ctx.restore();
  });
}

function _renderTopology(topology) {
  const devices = topology.devices || [];
  const topoEdges = topology.edges || [];
  const intermediates = new Set(topology.intermediates || []);
  const gatewayIp = topology.gateway || null;
  const subnet = topology.subnet || null;
  const subnets = topology.subnets || [];

  subnetsForDraw = subnets;

  const deviceMap = {};
  devices.forEach(function(d) { deviceMap[d.ip] = d; });

  const levelMap = {};
  levelMap["internet"] = 0;
  if (gatewayIp) levelMap[gatewayIp] = 1;
  intermediates.forEach(function(ip) { levelMap[ip] = 2; });
  devices.forEach(function(d) {
    if (!(d.ip in levelMap)) levelMap[d.ip] = 3;
  });

  const nodes = new vis.DataSet();
  const edgesDS = new vis.DataSet();

  const internetSvg = '<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">'
    + '<rect x="4" y="4" width="56" height="56" rx="14" fill="#0d0d0d" stroke="#333333" stroke-width="3"/>'
    + '<circle cx="32" cy="32" r="14" fill="none" stroke="#555555" stroke-width="2.5"/>'
    + '<ellipse cx="32" cy="32" rx="6" ry="14" fill="none" stroke="#555555" stroke-width="2"/>'
    + '<path d="M18 32h28M20 24h24M20 40h24" stroke="#555555" stroke-width="2" stroke-linecap="round"/>'
    + '</svg>';
  nodes.add({
    id: "internet",
    label: "ИНТЕРНЕТ",
    level: 0,
    shape: "image",
    image: "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(internetSvg),
    size: 24,
    font: { color: "#666666", size: 10, face: "monospace" },
    title: makeInternetTooltip(),
  });

  devices.forEach(function(device) {
    const role = getRole(device);
    const style = getRoleStyle(role);
    const hostname = (device.hostname && device.hostname !== device.ip) ? device.hostname : "";
    const level = (levelMap[device.ip] !== undefined) ? levelMap[device.ip] : 3;
    const isHighLevel = level <= 2;
    const flagged = !!device.embedded_device;
    const borderColor = flagged ? "#ffcc00" : style.border;
    const label = device.ip + (hostname ? "\n" + hostname : "") + (flagged ? "\n⚠ " + device.embedded_device : "");

    nodes.add({
      id: device.ip,
      label: label,
      title: makeTooltip(role, device, style),
      level: level,
      shape: "image",
      image: getRoleImage(role, style, flagged),
      size: style.size + 8,
      font: {
        color: flagged ? "#ffcc00" : (role === "gateway" ? "#00ff99" : (isHighLevel ? "#aaaaaa" : "#666666")),
        size: 10,
        bold: role === "gateway" || flagged,
        face: "monospace",
      },
      shadow: {
        enabled: true,
        color: borderColor + "44",
        size: role === "gateway" ? 14 : (isHighLevel ? 10 : 6),
        x: 0,
        y: 0,
      },
    });
  });

  if (topoEdges.length === 0 && devices.length > 0) {
    const fallbackGw = gatewayIp || devices[0].ip;
    edgesDS.add({ id: "gw-internet", from: fallbackGw, to: "internet", ...getEdgeStyle("uplink") });
    devices.forEach(function(d, i) {
      if (d.ip === fallbackGw) return;
      edgesDS.add({ id: "fb-" + i, from: d.ip, to: fallbackGw, ...getEdgeStyle("client") });
    });
  } else {
    topoEdges.forEach(function(edge, i) {
      const srcOk = edge.src === "internet" || !!deviceMap[edge.src];
      const dstOk = edge.dst === "internet" || !!deviceMap[edge.dst];
      if (!srcOk || !dstOk) return;
      edgesDS.add({ id: "e-" + i, from: edge.src, to: edge.dst, ...getEdgeStyle(edge.type || "client") });
    });
  }

  lastDeviceCount = devices.length;
  document.getElementById("counter").textContent = GRAPH_I18N[graphLang].counter.replace("{n}", devices.length);
  updateTopoPanel(subnet, gatewayIp, devices.length, intermediates.size);

  const container = document.getElementById("graph");
  if (network) network.destroy();

  network = new vis.Network(container, { nodes: nodes, edges: edgesDS }, buildOptions());

  network.on("afterDrawing", function(ctx) { _drawSubnetBoxes(ctx); });

  network.on("doubleClick", function(params) {
    if (params.nodes.length === 0) return;
    const nodeId = params.nodes[0];
    if (nodeId === "internet") return;
    const node = nodes.get(nodeId);
    if (!node) return;
    const ipLine = node.label ? node.label.split("\n")[0] : "";
    const name = prompt(GRAPH_I18N[graphLang].promptName.replace("{ip}", ipLine), node._customName || "");
    if (name === null) return;
    node._customName = name;
    nodes.update({ id: nodeId, label: name ? (ipLine + "\n " + name) : ipLine });
  });

  network.once("stabilizationIterationsDone", function() {
    network.fit({ animation: { duration: 600, easingFunction: "easeInOutQuad" } });
    network.redraw();
  });
}

function updateGraph(topologyJson) {
  let topology;
  try {
    topology = typeof topologyJson === "string" ? JSON.parse(topologyJson) : topologyJson;
  } catch(e) {
    return;
  }

  if (Array.isArray(topology)) {
    topology = {
      devices: topology,
      gateway: null,
      subnet: null,
      subnets: [],
      edges: [],
      intermediates: [],
    };
  }

  currentTopology = topology;
  _renderTopology(topology);
}
setGraphLang(graphLang);
</script>
